version: '3.8'

services:
  # The Engineering Database
  db:
    image: postgres:15-alpine
    container_name: mech_core_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mechanic_secret_password
      POSTGRES_DB: engineering_data
    ports:
      - "5432:5432"
    volumes:
      # Persist data in a local folder so it survives restarts
      - ./postgres_data:/var/lib/postgresql/data

  # Optional: A GUI to view the DB (Adminer)
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"